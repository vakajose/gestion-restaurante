# ==============================================================================
# VM 2 — Servidor Dedicado de Base de Datos PostgreSQL 16 (OCI VCN Privada)
# Ejecutar únicamente en VM 2 (sin IP pública en el puerto 5432)
# Uso: docker compose -f docker/postgres-vm2/docker-compose.db.yml up -d
# ==============================================================================

x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "10m"
    max-file: "5"

services:
  postgres:
    image: postgres:16-alpine
    container_name: restaurant-vm2-postgres
    restart: unless-stopped
    command: ["postgres", "-c", "config_file=/etc/postgresql/postgresql.conf"]
    ports:
      # Vincular idealmente a la IP privada de VM 2 en la VCN OCI: "${VM2_PRIVATE_IP:-127.0.0.1}:5432:5432"
      - "${VM2_BIND_IP:-127.0.0.1}:5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD}
      TZ: "UTC"
    volumes:
      - vm2_pg_data:/var/lib/postgresql/data
      - ./postgresql.conf:/etc/postgresql/postgresql.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging: *default-logging

volumes:
  vm2_pg_data:
