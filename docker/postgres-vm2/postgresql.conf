# ==============================================================================
# Tuning PostgreSQL 16 para VM 2 OCI (1 OCPU / 4 GB RAM) — ADR-0026
# ==============================================================================
listen_addresses = '*'
port = 5432

# Dimensionamiento estricto para Java 25 Virtual Threads (Prod pool=15 + Staging=5 + Admin)
max_connections = 50
shared_buffers = 1GB
effective_cache_size = 3GB
work_mem = 16MB
maintenance_work_mem = 256MB
wal_buffers = 16MB
min_wal_size = 256MB
max_wal_size = 1GB

# Durabilidad y TZ UTC (ADR-0006)
timezone = 'UTC'
log_timezone = 'UTC'
password_encryption = 'scram-sha-256'

# Logging acotado
logging_collector = off
log_min_duration_statement = 1000
log_line_prefix = '%m [%p] %q%u@%d '
