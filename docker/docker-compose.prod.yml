# ==============================================================================
# VM 1 Producción 24/7 — OCI Sovereign Stack (ADR-0026)
# Conecta por VCN Privada hacia VM 2 PostgreSQL (sin BD local en VM 1)
# Uso: docker compose -f docker/docker-compose.prod.yml --env-file .env up -d
# ==============================================================================

x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "10m"
    max-file: "5"

services:
  backend:
    image: ghcr.io/${GHCR_OWNER}/gestion-restaurante-backend:${IMAGE_TAG:-latest}
    container_name: restaurant-prod-backend
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: prod
      PORT: 8080
      LOG_PATH: /app/logs
      SPRING_DATASOURCE_URL: jdbc:postgresql://${DB_PRIVATE_HOST}:${DB_PORT:-5432}/${PROD_DB_NAME:-restaurant_prod}
      SPRING_DATASOURCE_USERNAME: ${PROD_DB_USER:-app_prod}
      SPRING_DATASOURCE_PASSWORD: ${PROD_DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      PLATFORM_JWT_SECRET: ${PLATFORM_JWT_SECRET}
      JWT_EXPIRATION_SECONDS: ${JWT_EXPIRATION_SECONDS:-900}
      PLATFORM_JWT_EXPIRATION_SECONDS: ${PLATFORM_JWT_EXPIRATION_SECONDS:-900}
      PLATFORM_ADMIN_USERNAME: ${PLATFORM_ADMIN_USERNAME:-superadmin}
      PLATFORM_ADMIN_EMAIL: ${PLATFORM_ADMIN_EMAIL}
      PLATFORM_ADMIN_PASSWORD: ${PLATFORM_ADMIN_PASSWORD:-}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
      APP_STORAGE_TYPE: ${APP_STORAGE_TYPE:-S3}
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_REGION: ${S3_REGION:-us-ashburn-1}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-}
      S3_PATH_STYLE_ACCESS: ${S3_PATH_STYLE_ACCESS:-true}
      S3_PUBLIC_BASE_URL: ${S3_PUBLIC_BASE_URL:-}
    volumes:
      - prod_backend_logs:/app/logs
      - prod_backend_uploads:/app/uploads/dishes
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/actuator/health | grep -q '\"UP\"'"]
      interval: 20s
      timeout: 5s
      start_period: 45s
      retries: 5
    logging: *default-logging
    networks:
      - restaurant_edge

  erp-frontend:
    image: ghcr.io/${GHCR_OWNER}/gestion-restaurante-erp:${IMAGE_TAG:-latest}
    container_name: restaurant-prod-erp
    restart: unless-stopped
    environment:
      API_BASE_URL: https://${API_DOMAIN}
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/healthz | grep -q 'ok'"]
      interval: 30s
      timeout: 3s
      retries: 3
    logging: *default-logging
    networks:
      - restaurant_edge

  backoffice-frontend:
    image: ghcr.io/${GHCR_OWNER}/gestion-restaurante-backoffice:${IMAGE_TAG:-latest}
    container_name: restaurant-prod-backoffice
    restart: unless-stopped
    environment:
      API_BASE_URL: https://${API_DOMAIN}
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/healthz | grep -q 'ok'"]
      interval: 30s
      timeout: 3s
      retries: 3
    logging: *default-logging
    networks:
      - restaurant_edge

  dozzle:
    image: amir20/dozzle:v8.12.7
    container_name: restaurant-prod-dozzle
    restart: unless-stopped
    environment:
      DOZZLE_NO_ANALYTICS: "true"
      DOZZLE_ENABLE_ACTIONS: "false"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    logging: *default-logging
    networks:
      - restaurant_edge

  caddy:
    image: caddy:2.9-alpine
    container_name: restaurant-prod-caddy
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      ACME_EMAIL: ${ACME_EMAIL}
      API_DOMAIN: ${API_DOMAIN}
      APP_DOMAIN: ${APP_DOMAIN}
      ADMIN_DOMAIN: ${ADMIN_DOMAIN}
      LOGS_DOMAIN: ${LOGS_DOMAIN}
      DOZZLE_ADMIN_USER: ${DOZZLE_ADMIN_USER}
      DOZZLE_ADMIN_PASSWORD_HASH: ${DOZZLE_ADMIN_PASSWORD_HASH}
      STAGING_API_DOMAIN: ${STAGING_API_DOMAIN:-staging-api.invalid}
      STAGING_APP_DOMAIN: ${STAGING_APP_DOMAIN:-staging-app.invalid}
      STAGING_ADMIN_DOMAIN: ${STAGING_ADMIN_DOMAIN:-staging-admin.invalid}
      STAGING_BASIC_AUTH_USER: ${STAGING_BASIC_AUTH_USER:-qa}
      STAGING_BASIC_AUTH_HASH: ${STAGING_BASIC_AUTH_HASH:-}
    # Principio de mínimo privilegio (ADR-0026): Caddy NO monta /var/run/docker.sock
    volumes:
      - ./caddy/Caddyfile.cloud:/etc/caddy/Caddyfile:ro
      - ./caddy/conf.d:/etc/caddy/conf.d:ro
      - caddy_data:/data
      - caddy_config:/config
    logging: *default-logging
    networks:
      - restaurant_edge

volumes:
  prod_backend_logs:
  prod_backend_uploads:
  caddy_data:
  caddy_config:

networks:
  restaurant_edge:
    name: restaurant_edge
    driver: bridge
