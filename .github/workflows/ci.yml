name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  backend:
    name: Backend CI (Spring Boot & Modulith)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Check if Backend exists
        id: check_backend
        run: |
          if [ -f "backend/pom.xml" ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
            echo "Backend no inicializado todavía. Omitiendo tests."
          fi

      - name: Set up Java 25 (Amazon Corretto)
        if: steps.check_backend.outputs.exists == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: 'corretto'
          java-version: '25'
          cache: 'maven'

      - name: Run Backend Tests
        if: steps.check_backend.outputs.exists == 'true'
        working-directory: backend
        run: |
          chmod +x mvnw
          ./mvnw clean test

  frontend:
    name: Frontend CI (Angular 22)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Check if Frontend exists
        id: check_frontend
        run: |
          if [ -f "frontend/package.json" ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
            echo "Frontend no inicializado todavía. Omitiendo tests."
          fi

      - name: Set up Node.js
        if: steps.check_frontend.outputs.exists == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Dependencies
        if: steps.check_frontend.outputs.exists == 'true'
        working-directory: frontend
        run: npm ci

      - name: Run Linter
        if: steps.check_frontend.outputs.exists == 'true'
        working-directory: frontend
        run: npm run lint --if-present

      - name: Run Frontend Tests
        if: steps.check_frontend.outputs.exists == 'true'
        working-directory: frontend
        run: npm test -- --watch=false --browsers=ChromeHeadless
