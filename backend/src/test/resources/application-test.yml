spring:
  application:
    name: restaurant-pos-erp
  threads:
    virtual:
      enabled: true
  jackson:
    datatype:
      datetime:
        write-dates-as-timestamps: false
    time-zone: UTC
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: false
