spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://postgres:5432/restaurant_testing}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}
    hikari:
      pool-name: RestaurantTestingLocalPool
      maximum-pool-size: 10
      minimum-idle: 2
  flyway:
    baseline-on-migrate: false
    clean-disabled: false

restaurant:
  security:
    jwt:
      secret: ${JWT_SECRET}
      expiration-seconds: ${JWT_EXPIRATION_SECONDS:900}
    platform-jwt:
      secret: ${PLATFORM_JWT_SECRET:${JWT_SECRET}}
      expiration-seconds: ${PLATFORM_JWT_EXPIRATION_SECONDS:900}

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:*,https://*.localhost,http://127.0.0.1:*}
