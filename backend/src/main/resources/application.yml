spring:
  application:
    name: restaurant-pos-erp
  profiles:
    default: dev
  threads:
    virtual:
      enabled: true
  jackson:
    datatype:
      datetime:
        write-dates-as-timestamps: false
    time-zone: UTC
  datasource:
    driver-class-name: org.postgresql.Driver
    hikari:
      connection-timeout: 10000
      idle-timeout: 300000
      max-lifetime: 1800000
      leak-detection-threshold: 15000
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: false
        jdbc:
          time_zone: UTC
  flyway:
    enabled: ${SPRING_FLYWAY_ENABLED:true}
    locations: classpath:db/migration

app:
  storage:
    type: ${APP_STORAGE_TYPE:local}
    local-path: ${APP_STORAGE_LOCAL_PATH:./uploads/dishes/}
    public-url-prefix: ${APP_STORAGE_PUBLIC_URL_PREFIX:/uploads/dishes/}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:*,http://127.0.0.1:*}

server:
  port: ${PORT:8080}
  forward-headers-strategy: framework
