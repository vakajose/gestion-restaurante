spring:
  application:
    name: restaurant-pos-erp
  profiles:
    default: dev
  threads:
    virtual:
      enabled: true
  jackson:
    datatype:
      datetime:
        write-dates-as-timestamps: false
    time-zone: UTC
  datasource:
    driver-class-name: org.postgresql.Driver
    hikari:
      connection-timeout: 10000
      idle-timeout: 300000
      max-lifetime: 1800000
      leak-detection-threshold: 15000
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: false
        jdbc:
          time_zone: UTC
  flyway:
    enabled: ${SPRING_FLYWAY_ENABLED:true}
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: ${APP_MULTIPART_MAX_FILE_SIZE:10MB}
      max-request-size: ${APP_MULTIPART_MAX_REQUEST_SIZE:12MB}

app:
  storage:
    type: ${APP_STORAGE_TYPE:LOCAL}
    local-path: ${APP_STORAGE_LOCAL_PATH:./uploads/dishes/}
    public-url-prefix: ${APP_STORAGE_PUBLIC_URL_PREFIX:/uploads/dishes/}
    s3:
      endpoint: ${S3_ENDPOINT:}
      region: ${S3_REGION:us-ashburn-1}
      bucket: ${S3_BUCKET:}
      access-key: ${S3_ACCESS_KEY:}
      secret-key: ${S3_SECRET_KEY:}
      path-style-access: ${S3_PATH_STYLE_ACCESS:true}
      public-base-url: ${S3_PUBLIC_BASE_URL:}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:*,http://127.0.0.1:*}
  platform:
    admin:
      username: ${PLATFORM_ADMIN_USERNAME:}
      email: ${PLATFORM_ADMIN_EMAIL:}
      password: ${PLATFORM_ADMIN_PASSWORD:}
      full-name: ${PLATFORM_ADMIN_FULL_NAME:Platform Superadmin}

server:
  port: ${PORT:8080}
  forward-headers-strategy: framework
