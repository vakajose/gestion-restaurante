<div class="relative inline-block text-left">
  <!-- Botón disparador -->
  <button
    type="button"
    data-testid="emoji-picker-trigger"
    (click)="toggle()"
    [disabled]="disabled()"
    class="flex items-center justify-center gap-1.5 px-3 py-2 border border-border dark:border-darkborder rounded-[7px] bg-white dark:bg-dark text-lg hover:border-primary focus:outline-hidden focus:ring-2 focus:ring-primary/20 transition-all cursor-pointer disabled:opacity-50 disabled:cursor-not-allowed shadow-2xs"
    [title]="'Seleccionar icono/emoji: ' + selectedEmoji()"
  >
    <span class="text-xl leading-none select-none">{{ selectedEmoji() || '🍽️' }}</span>
    <span class="text-[10px] text-bodytext dark:text-darklink select-none">▼</span>
  </button>

  <!-- Backdrop click-outside -->
  @if (isOpen()) {
    <div
      class="fixed inset-0 z-40 bg-black/10 dark:bg-black/30 backdrop-blur-[0.5px]"
      (click)="close()"
      aria-hidden="true"
    ></div>

    <!-- Popover Flotante -->
    <div
      data-testid="emoji-picker-popover"
      class="absolute left-0 mt-1.5 z-50 w-72 sm:w-80 p-3 bg-white dark:bg-darkcard border border-border dark:border-darkborder rounded-[9px] shadow-xl text-bodytext dark:text-white animate-in fade-in zoom-in-95 duration-100"
    >
      <!-- Cabecera / Buscador -->
      <div class="mb-2">
        <div class="relative">
          <input
            type="text"
            data-testid="emoji-search-input"
            [ngModel]="searchQuery()"
            (ngModelChange)="searchQuery.set($event)"
            placeholder="Buscar emoji... (ej. café, carne, burger)"
            class="w-full text-xs py-1.5 pl-7 pr-2 border border-border dark:border-darkborder rounded-[6px] bg-lightgray/40 dark:bg-dark focus:border-primary focus:outline-hidden text-link dark:text-white placeholder:text-bodytext/60"
          />
          <span class="absolute left-2 top-1.5 text-xs text-bodytext/60 select-none">🔍</span>
          @if (searchQuery()) {
            <button
              type="button"
              (click)="searchQuery.set('')"
              class="absolute right-2 top-1.5 text-xs text-bodytext hover:text-error cursor-pointer"
            >
              ✕
            </button>
          }
        </div>
      </div>

      <!-- Pestañas de Secciones Gastronómicas -->
      <div class="flex items-center gap-1 overflow-x-auto pb-1.5 mb-2 scrollbar-thin text-xs border-b border-border/60 dark:border-darkborder/60">
        <button
          type="button"
          data-testid="emoji-section-all"
          (click)="selectSection('all')"
          [class.bg-primary]="activeSectionId() === 'all'"
          [class.text-white]="activeSectionId() === 'all'"
          [class.bg-lightprimary]="activeSectionId() !== 'all'"
          [class.text-bodytext]="activeSectionId() !== 'all'"
          class="px-2 py-0.5 rounded-[5px] text-[11px] font-medium shrink-0 cursor-pointer hover:bg-primary hover:text-white transition-colors"
        >
          Todos
        </button>
        @for (sec of sections; track sec.id) {
          <button
            type="button"
            [attr.data-testid]="'emoji-section-' + sec.id"
            (click)="selectSection(sec.id)"
            [class.bg-primary]="activeSectionId() === sec.id"
            [class.text-white]="activeSectionId() === sec.id"
            [class.bg-lightprimary]="activeSectionId() !== sec.id"
            class="px-1.5 py-0.5 rounded-[5px] text-xs shrink-0 cursor-pointer hover:bg-primary hover:text-white transition-colors"
            [title]="sec.name"
          >
            {{ sec.icon }}
          </button>
        }
      </div>

      <!-- Cuadrícula de Emojis -->
      <div class="max-h-44 overflow-y-auto grid grid-cols-7 gap-1 p-1 scrollbar-thin">
        @for (item of filteredEmojis(); track item.char) {
          <button
            type="button"
            class="emoji-item-btn h-8 w-8 text-xl flex items-center justify-center rounded-[5px] hover:bg-lightprimary/80 dark:hover:bg-darkborder hover:scale-110 active:scale-95 transition-transform cursor-pointer select-none"
            [attr.data-emoji]="item.char"
            [attr.data-testid]="'emoji-item-' + item.char"
            (click)="selectEmoji(item.char)"
            [class.ring-2]="selectedEmoji() === item.char"
            [class.ring-primary]="selectedEmoji() === item.char"
            [class.bg-lightprimary]="selectedEmoji() === item.char"
            [title]="item.name"
          >
            {{ item.char }}
          </button>
        } @empty {
          <div class="col-span-7 py-4 text-center text-xs text-bodytext dark:text-darklink">
            No se encontraron emojis
          </div>
        }
      </div>

      <!-- Pie / Pegar emoji personalizado -->
      <div class="mt-2 pt-2 border-t border-border/60 dark:border-darkborder/60 flex items-center justify-between gap-2 text-[11px]">
        <span class="text-bodytext/80 dark:text-darklink/80 shrink-0">O pega otro:</span>
        <input
          type="text"
          data-testid="emoji-custom-input"
          maxlength="4"
          placeholder="Ej: 🍇"
          (keydown.enter)="onCustomEmojiInput($event)"
          (change)="onCustomEmojiInput($event)"
          class="w-16 text-center py-0.5 px-1 border border-border dark:border-darkborder rounded-[5px] bg-white dark:bg-dark text-sm focus:border-primary focus:outline-hidden"
        />
      </div>
    </div>
  }
</div>
